<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060c"/>
      <stop offset="100%" stop-color="#0e0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="900" cy="200" r="350" fill="#818cf8" opacity="0.06" filter="blur(60px)"/>
  <circle cx="250" cy="450" r="280" fill="#34d399" opacity="0.04" filter="blur(60px)"/>

  <g transform="translate(100, 165)">
    <circle cx="80" cy="80" r="65" fill="url(#glow)" filter="blur(20px)"/>
    <rect x="10" y="10" width="140" height="140" rx="28" fill="url(#accent)"/>
    <path d="M55 110 V50 C55 45 58 40 63 40 H85 C95 40 100 48 100 58 C100 68 95 76 85 76 H70 V110 Z" fill="#1a1a18"/>
    <circle cx="75" cy="58" r="12" fill="#818cf8"/>
  </g>

  <text x="290" y="255" font-family="Georgia, serif" font-size="78" font-weight="700" fill="#e8e6e1" letter-spacing="-1">PromptsHub</text>
  <text x="290" y="315" font-family="Arial, sans-serif" font-size="26" fill="#a09eaa" letter-spacing="0.5">The prompts behind great work</text>

  <g transform="translate(290, 355)" font-family="monospace" font-size="20" fill="#5e5d70">
    <text x="0" y="0">144+ prompts</text>
    <circle cx="134" cy="-4" r="3" fill="#5e5d70"/>
    <text x="152" y="0">15 categories</text>
    <circle cx="306" cy="-4" r="3" fill="#5e5d70"/>
    <text x="324" y="0">1-click copy</text>
  </g>

  <line x1="100" y1="530" x2="1100" y2="530" stroke="#818cf8" stroke-opacity="0.12" stroke-width="1"/>
  <text x="600" y="560" text-anchor="middle" font-family="monospace" font-size="16" fill="#5e5d70">jamescowx.github.io/promptshub</text>
</svg>
